<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPMN Canvas</title>
</head>
<body>
  <!-- Strings come from lang/ through the exported JSON: a data-i18n attribute sets the text,
       data-i18n-title / data-i18n-aria-label set that attribute (see main.js). -->

  <!-- The list of Diagrams -->
  <div id="library" class="library" hidden>
    <header class="library-header">
      <h1 data-i18n="standalone.app_title"></h1>
      <span class="spacer"></span>
      <label class="language">
        <span data-i18n="messages.language"></span>
        <select id="language"></select>
      </label>
    </header>
    <div class="library-actions">
      <button type="button" id="btn-new" class="primary" data-i18n="standalone.new_diagram"></button>
      <button type="button" id="btn-import" data-i18n="standalone.import_bpmn"></button>
      <input type="file" id="import-file" accept=".bpmn,.xml,application/xml,text/xml" hidden>
      <button type="button" id="btn-export-all" data-i18n="standalone.export_all"></button>
    </div>
    <p class="library-notice" data-i18n="standalone.storage_notice"></p>
    <table class="library-table">
      <thead>
        <tr>
          <th data-i18n="messages.diagram_column_title"></th>
          <th data-i18n="standalone.modified"></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="library-list"></tbody>
    </table>
    <p id="library-empty" class="library-empty" data-i18n="messages.no_diagrams_yet" hidden></p>
  </div>

  <!-- The Editor: the same markup the server page has, minus what needs a server -->
  <div id="editor-view" class="h-full" hidden>
    <div class="app" id="app">
      <header>
        <a href="#/" id="btn-back-to-list" class="button-link">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
          <span data-i18n="messages.back"></span>
        </a>
        <span class="brand" id="editor-brand"></span>
        <span class="spacer"></span>
        <div class="dropdown">
          <button type="button" id="btn-export" data-i18n="standalone.export"></button>
          <div class="dropdown-menu">
            <button type="button" data-export="png" data-i18n="messages.png_image"></button>
            <button type="button" data-export="svg" data-i18n="messages.svg_image"></button>
            <button type="button" data-export="bpmn" data-i18n="messages.bpmn_file"></button>
          </div>
        </div>
        <button type="button" id="btn-save-to-file" data-i18n="standalone.save_to_file"></button>
        <span class="dirty" id="dirty" data-i18n-title="messages.unsaved_changes">●</span>
        <button type="button" class="primary" id="btn-save" title="Ctrl+S" data-i18n="messages.save"></button>
      </header>
      <aside id="version-panel" hidden>
        <div class="aside-head">
          <span data-i18n="messages.versions"></span>
          <button type="button" id="btn-history-close" data-panel-close data-i18n-aria-label="messages.close">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 18 18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <p class="version-hint" data-i18n="messages.select_two_versions_hint"></p>
        <ul id="version-list"></ul>
        <div class="version-compare-bar">
          <span id="version-compare-count">0/2</span>
          <button type="button" id="btn-compare-selected" disabled data-i18n="messages.compare_selected"></button>
        </div>
      </aside>
      <nav class="panel-bar">
        <button
          type="button"
          id="btn-version-history-entry"
          class="panel-toggle"
          data-panel-toggle="version-panel"
          data-i18n-title="messages.version_history"
          data-i18n-aria-label="messages.version_history"
        ><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg></button>
      </nav>
      <main>
        <div id="canvas"></div>
        <div class="zoom">
          <button type="button" id="zoom-in" data-i18n-title="messages.zoom_in" data-i18n-aria-label="messages.zoom_in"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 4.5v15m7.5-7.5h-15"/></svg></button>
          <button type="button" id="zoom-out" data-i18n-title="messages.zoom_out" data-i18n-aria-label="messages.zoom_out"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button type="button" id="zoom-fit" data-i18n-title="messages.fit_to_screen" data-i18n-aria-label="messages.fit_to_screen"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/></svg></button>
        </div>
        <div class="diff-banner" id="diff-banner" hidden>
          <strong id="diff-banner-label"></strong>
          <span class="legend"><span class="swatch added"></span><span data-i18n="messages.diff_added"></span></span>
          <span class="legend"><span class="swatch changed"></span><span data-i18n="messages.diff_changed"></span></span>
          <span class="legend"><span class="swatch removed"></span><span data-i18n="messages.diff_removed"></span></span>
          <button type="button" id="btn-diff-exit" data-i18n="messages.exit_comparison"></button>
        </div>
        <div class="diff-removed-panel" id="diff-removed-panel" hidden>
          <div class="head" data-i18n="messages.diff_removed_elements"></div>
          <ul id="diff-removed-list"></ul>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
