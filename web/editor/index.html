<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Editor BPMN</title>
  <link rel="stylesheet" href="/vendor/bpmn-js/assets/diagram-js.css">
  <link rel="stylesheet" href="/vendor/bpmn-js/assets/bpmn-js.css">
  <link rel="stylesheet" href="/vendor/bpmn-js/assets/bpmn-font/css/bpmn-embedded.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app with-sidebar">
    <header>
      <span class="brand">Editor BPMN</span>
      <button type="button" id="btn-new">Novo</button>
      <button type="button" id="btn-import" title="Abrir um .bpmn do seu computador">Importar arquivo…</button>
      <input type="file" id="file-input" accept=".bpmn,.xml" hidden>
      <span class="spacer"></span>
      <input type="text" id="name" placeholder="Nome do diagrama" autocomplete="off" spellcheck="false">
      <span class="suffix">.bpmn</span>
      <span class="dirty" id="dirty" title="Alterações não salvas">●</span>
      <button type="button" class="primary" id="btn-save" title="Ctrl+S">Salvar</button>
      <button type="button" id="btn-share" title="Copiar link público somente leitura">Copiar link</button>
      <div class="dropdown">
        <button type="button">Baixar ▾</button>
        <div class="dropdown-menu">
          <button type="button" data-export="bpmn">Arquivo BPMN (.bpmn)</button>
          <button type="button" data-export="svg">Imagem SVG</button>
          <button type="button" data-export="png">Imagem PNG</button>
        </div>
      </div>
      <button type="button" class="danger" id="btn-delete">Excluir</button>
    </header>

    <aside>
      <div class="aside-head">
        <span>Diagramas</span>
        <button type="button" id="btn-refresh" title="Atualizar lista">↻</button>
      </div>
      <input type="text" id="filter" placeholder="Filtrar…" autocomplete="off">
      <ul id="list"></ul>
    </aside>

    <main>
      <div id="canvas"></div>
      <div class="zoom">
        <button type="button" id="zoom-in" title="Aproximar">+</button>
        <button type="button" id="zoom-out" title="Afastar">−</button>
        <button type="button" id="zoom-fit" title="Ajustar à tela">⤢</button>
      </div>
    </main>
  </div>

  <script src="/vendor/bpmn-js/bpmn-modeler.production.min.js"></script>
  <script src="/assets/common.js"></script>
  <script src="editor.js"></script>
</body>
</html>
