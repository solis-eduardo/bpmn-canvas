<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Visualizador BPMN</title>
  <link rel="stylesheet" href="/vendor/bpmn-js/assets/diagram-js.css">
  <link rel="stylesheet" href="/vendor/bpmn-js/assets/bpmn-js.css">
  <link rel="stylesheet" href="/vendor/bpmn-js/assets/bpmn-font/css/bpmn.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app">
    <header>
      <span class="title" id="title">Visualizador BPMN</span>
      <span class="spacer"></span>
      <div class="dropdown">
        <button type="button" id="btn-download" disabled>Baixar ▾</button>
        <div class="dropdown-menu">
          <button type="button" data-export="png">Imagem PNG</button>
          <button type="button" data-export="svg">Imagem SVG</button>
          <button type="button" data-export="bpmn">Arquivo BPMN (.bpmn)</button>
        </div>
      </div>
    </header>
    <main>
      <div id="canvas"></div>
      <div class="message" id="message">Carregando…</div>
      <div class="zoom">
        <button type="button" id="zoom-in" title="Aproximar">+</button>
        <button type="button" id="zoom-out" title="Afastar">−</button>
        <button type="button" id="zoom-fit" title="Ajustar à tela">⤢</button>
      </div>
    </main>
  </div>

  <script src="/vendor/bpmn-js/bpmn-navigated-viewer.production.min.js"></script>
  <script src="/assets/common.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
