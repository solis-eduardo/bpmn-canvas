server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / {
        return 302 /editor/;
    }

    # ---------------------------------------------------------------
    # Editor (protegido por usuário/senha)
    # ---------------------------------------------------------------
    location /editor/ {
        auth_basic           "Editor BPMN";
        auth_basic_user_file /etc/nginx/htpasswd;
        try_files $uri $uri/ =404;
    }

    # Listagem dos diagramas (JSON) — somente editor
    location = /api/files/ {
        auth_basic           "Editor BPMN";
        auth_basic_user_file /etc/nginx/htpasswd;

        limit_except GET { deny all; }

        alias            /data/diagrams/;
        autoindex        on;
        autoindex_format json;
        add_header Cache-Control "no-store" always;
    }

    # Ler / gravar / excluir um diagrama — somente editor
    location ~ "^/api/files/(?<bpmn_file>[A-Za-z0-9][A-Za-z0-9._-]{0,120}\.bpmn)$" {
        auth_basic           "Editor BPMN";
        auth_basic_user_file /etc/nginx/htpasswd;

        limit_except GET PUT DELETE { deny all; }

        alias       /data/diagrams/$bpmn_file;
        dav_methods PUT DELETE;
        dav_access  user:rw group:rw all:r;
        default_type application/xml;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        return 404;
    }

    # ---------------------------------------------------------------
    # Público (somente leitura, sem login, sem listagem)
    # ---------------------------------------------------------------
    location ~ "^/files/(?<bpmn_file>[A-Za-z0-9][A-Za-z0-9._-]{0,120}\.bpmn)$" {
        limit_except GET { deny all; }
        alias        /data/diagrams/$bpmn_file;
        default_type application/xml;
        add_header Cache-Control "no-cache" always;
    }

    location /files/ {
        return 404;
    }

    location /view/ {
        try_files $uri $uri/ =404;
    }

    location /vendor/ {
        expires 7d;
    }

    location /assets/ {
        expires 1h;
    }
}
