server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    include snippets/security-headers.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite output is content-hashed; vendored libs are pinned by the image.
    # (add_header in a location replaces the server-level ones, so repeat them.)
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=86400";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller is executable; any other .php is a 404.
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
