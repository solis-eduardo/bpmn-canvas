; Production tuning layered over php.ini-production (see Dockerfile).
; The code is baked into the image, so opcache never needs to re-stat files.
expose_php = Off
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
