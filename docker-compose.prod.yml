# Production overlay. Always use it for production hosts:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - Layers `.env.prod` (non-secret production settings) over `.env`, so
#   APP_ENV=production, APP_DEBUG=false, stderr logging and the entrypoint's
#   `artisan optimize` apply. Secrets stay in `.env`.
# - Attaches `web` to the shared `nginx-network` so an existing reverse proxy
#   (e.g. nginx/Traefik terminating HTTPS) reaches it as `bpmn-canvas`, and
#   unpublishes `web`'s host port: it is only reachable through that proxy.
#   Create the network once per host if it doesn't exist yet:
#     docker network create nginx-network
#
# On a host without a shared proxy, drop the `ports: !reset []` and
# `networks` entries below (or use your own overlay) to keep the host port.
x-prod-env: &prod-env
  env_file:
    - .env
    - .env.prod

services:
  app: *prod-env
  queue: *prod-env
  scheduler: *prod-env
  web:
    ports: !reset []
    networks:
      default: {}
      # Alias keeps the name existing proxy upstreams already point to.
      nginx-network:
        aliases:
          - bpmn-canvas

networks:
  nginx-network:
    external: true
