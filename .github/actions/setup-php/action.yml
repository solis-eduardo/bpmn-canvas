name: Setup PHP
description: Sets up PHP with the project's default version.

inputs:
  php-version:
    description: PHP version to install
    default: '8.4'
  extensions:
    description: Extra PHP extensions to install (comma-separated)
    default: ''

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: none
