name: Setup PHP + Composer dependencies
description: Sets up PHP and installs Composer dependencies, with caching.

inputs:
  php-version:
    description: PHP version to install
    default: '8.5'
  extensions:
    description: Extra PHP extensions to install (comma-separated)
    default: ''

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: none

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      # Not ramsey/composer-install: its own action.yml pins an old
      # actions/cache commit that still targets the deprecated Node 20
      # runtime. actions/cache@v6 is current and avoids that warning.
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress
