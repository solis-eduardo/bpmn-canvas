name: Browser demo

# Builds the browser demo (demo/build.sh) and smoke-tests it in headless Chrome. Pushes to main also
# publish it to GitHub Pages; a failing smoke test stops the deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test the demo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip
          tools: composer
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the demo bundle
        # Writes the bundle size to the job summary.
        run: demo/build.sh

      - name: Smoke-test the demo bundle
        run: node demo/smoke.mjs demo/dist

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Enable GitHub Pages (GitHub Actions source)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
