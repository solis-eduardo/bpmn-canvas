name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.filter.outputs.php }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            php:
              - '**/*.php'
              - '**/*.blade.php'
              - 'composer.json'
              - 'composer.lock'
              - 'phpstan.neon'
              - 'phpmd.xml'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  setup:
    name: Install Composer dependencies
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        # Not ramsey/composer-install: its own action.yml pins an old
        # actions/cache commit that still targets the deprecated Node 20
        # runtime. actions/cache@v6 is current and avoids that warning.
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Archive vendor directory
        # Uploaded/downloaded as a plain directory, actions/upload-artifact
        # zips it in a way that drops the executable bit on vendor/bin/*
        # (they're symlinks to the real bin scripts), so `vendor/bin/pint`
        # etc. fail with "Permission denied" downstream. tar preserves
        # both the symlinks and their permissions.
        run: tar -czf vendor.tar.gz vendor

      - name: Upload vendor archive
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor.tar.gz
          retention-days: 1

  pint:
    name: Pint (code style)
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php

      - name: Download vendor archive
        uses: actions/download-artifact@v4
        with:
          name: vendor

      - name: Extract vendor archive
        run: tar -xzf vendor.tar.gz

      - name: Run Pint
        run: vendor/bin/pint --test

  tests:
    name: PHPUnit
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php
        with:
          extensions: pdo_sqlite

      - name: Download vendor archive
        uses: actions/download-artifact@v4
        with:
          name: vendor

      - name: Extract vendor archive
        run: tar -xzf vendor.tar.gz

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install npm dependencies
        # `npm ci` requires a committed package-lock.json, which not every
        # branch has yet (only PRs that touched the front-end build added
        # one); `npm install` works either way.
        run: npm install

      - name: Build front-end assets
        # Several views render through the shared layout's @vite directive
        # (see resources/views/components/layouts/app.blade.php); without a
        # built manifest those views 500 out from under the test suite.
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run test suite
        run: php artisan test

  phpstan:
    name: PHPStan (static analysis)
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php

      - name: Download vendor archive
        uses: actions/download-artifact@v4
        with:
          name: vendor

      - name: Extract vendor archive
        run: tar -xzf vendor.tar.gz

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  phpmd:
    name: PHPMD (static analysis)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-php

      - name: Download PHPMD
        # Run as a standalone .phar rather than a Composer dev-dependency:
        # phpmd/phpmd's own dependency tree (pdepend, an old symfony/*) does
        # not resolve cleanly against this Laravel app's Symfony 8-based
        # dependencies, so it's kept fully isolated from composer.json/lock,
        # and this job never needs the `vendor` artifact the other PHP jobs
        # share.
        run: |
          curl -sSL -o phpmd.phar https://github.com/phpmd/phpmd/releases/latest/download/phpmd.phar
          chmod +x phpmd.phar

      - name: Run PHPMD
        run: php phpmd.phar app,database,routes text phpmd.xml
